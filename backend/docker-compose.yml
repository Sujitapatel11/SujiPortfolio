version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: sujis_world_db
    restart: always
    environment:
      POSTGRES_USER: suji_user
      POSTGRES_PASSWORD: suji_password
      POSTGRES_DB: sujis_world_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U suji_user -d sujis_world_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build: .
    container_name: sujis_world_backend
    restart: always
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://suji_user:suji_password@db:5432/sujis_world_db
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - ENVIRONMENT=development
    volumes:
      - .:/app
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
