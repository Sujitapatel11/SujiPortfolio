name: Personal Assistant Companion CI

on:
  push:
    branches:
      - feat/personal-assistant-foundation
    paths:
      - "companion/**"
      - "backend/**"
      - "frontend/**"
      - "README.md"
      - ".github/workflows/assistant-companion-ci.yml"
  pull_request:
    paths:
      - "companion/**"
      - "backend/**"
      - "frontend/**"
      - "README.md"
      - ".github/workflows/assistant-companion-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  companion-tests:
    name: Companion unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: companion/requirements.txt
      - name: Install dependencies
        run: python -m pip install -r companion/requirements.txt
      - name: Run companion tests
        run: python -m pytest companion/tests -q
