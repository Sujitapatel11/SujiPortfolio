name: Application CI

on:
  push:
    branches:
      - feat/personal-assistant-foundation
    paths:
      - "companion/**"
      - "backend/**"
      - "frontend/**"
      - ".github/workflows/**"
      - "README.md"
  pull_request:
    paths:
      - "companion/**"
      - "backend/**"
      - "frontend/**"
      - ".github/workflows/**"
      - "README.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  companion-tests:
    name: Companion unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: companion/requirements.txt
      - run: python -m pip install -r companion/requirements.txt
      - run: python -m pytest companion/tests -q

  backend-check:
    name: Backend dependency and syntax check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: python -m pip install -r backend/requirements.txt
      - name: Compile backend Python files
        run: python -m compileall -q backend/app
      - name: Run assistant and client-management tests
        working-directory: backend
        env:
          DATABASE_URL: sqlite:///./ci-test.db
          JWT_SECRET_KEY: ci-only-test-secret-not-for-production
        run: python -m pytest tests test_appointments_and_tools.py -q

  frontend-build:
    name: Frontend production build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
