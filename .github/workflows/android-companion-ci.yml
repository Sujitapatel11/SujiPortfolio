name: Android Companion CI

on:
  push:
    branches:
      - feat/unified-device-aware-companion
      - feat/hey-suji-mobile-execution
      - main
    paths:
      - "android-companion/**"
      - ".github/workflows/android-companion-ci.yml"
  pull_request:
    paths:
      - "android-companion/**"
      - ".github/workflows/android-companion-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-unit-tests:
    name: Android assemble and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Build Android companion and run unit tests
        run: gradle -p android-companion :app:assembleDebug :app:testDebugUnitTest
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: hey-suji-android-debug
          path: android-companion/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
