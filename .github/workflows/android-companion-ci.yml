name: Android Companion CI

on:
  push:
    branches:
      - feat/unified-device-aware-companion
      - main
    paths:
      - "android-companion/**"
      - ".github/workflows/android-companion-ci.yml"
  pull_request:
    paths:
      - "android-companion/**"
      - ".github/workflows/android-companion-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-unit-tests:
    name: Android parser unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Run Android unit tests
        run: gradle -p android-companion :app:testDebugUnitTest
