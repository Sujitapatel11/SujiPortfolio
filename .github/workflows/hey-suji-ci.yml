name: Hey Suji Portfolio CI

on:
  push:
    branches:
      - feat/unified-device-aware-companion
      - feat/hey-suji-mobile-execution
      - main
    paths:
      - "frontend/**"
      - ".github/workflows/hey-suji-ci.yml"
  pull_request:
    paths:
      - "frontend/**"
      - ".github/workflows/hey-suji-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend-build:
    name: Portfolio production build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
