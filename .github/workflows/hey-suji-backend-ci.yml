name: Hey Suji Backend CI

on:
  push:
    branches:
      - feat/unified-device-aware-companion
      - main
    paths:
      - "backend/**"
      - ".github/workflows/hey-suji-backend-ci.yml"
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/hey-suji-backend-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend-tests:
    name: Backend tests and migration validation
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: backend
    env:
      ENVIRONMENT: test
      DATABASE_URL: sqlite://
      ADMIN_USERNAME: ci-owner
      ADMIN_PASSWORD_HASH: $2b$12$wJ4j2oK1YxQjM5hVvJ0V1e8g8h7xj8r4Yxq3nYjM7x1J3V9xQ2b6K
      JWT_SECRET_KEY: ci-only-secret-key-not-for-production-000000000000
      CORS_ORIGINS: https://ci.example.test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest
      - name: Run backend test suite
        run: >-
          pytest -q
          test_assistant_policy.py
          test_assistant_routes.py
          test_assistant_api_security.py
          test_assistant_execution_queue.py
      - name: Validate Alembic migration graph
        run: alembic heads
